version: '3.8'

services:
  # ==========================================
  # Python Analytics & Threat Engine Microservice
  # ==========================================
  python-service:
    build:
      context: ./services/python-service
      dockerfile: Dockerfile
    container_name: python-threat-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=threat-analytics-service
      - ENVIRONMENT=production
      - VERSION=1.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - ANOMALY_THRESHOLD=75.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - devsecops-network
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ==========================================
  # Node.js API Gateway & Ingestion Microservice
  # ==========================================
  node-service:
    build:
      context: ./services/node-service
      dockerfile: Dockerfile
    container_name: node-gateway-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - SERVICE_NAME=node-gateway-service
      - ENVIRONMENT=production
      - VERSION=1.0.0
      - PORT=3000
      - PYTHON_SERVICE_URL=http://python-service:8000
      - PYTHON_TIMEOUT_MS=5000
      - RATE_LIMIT_MAX=1000
      - LOG_LEVEL=info
    depends_on:
      python-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - devsecops-network
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ==========================================
  # Prometheus Observability & Metrics Scraper
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: devsecops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - node-service
      - python-service
    networks:
      - devsecops-network

networks:
  devsecops-network:
    driver: bridge
