global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'node-gateway-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['node-service:3000']

  - job_name: 'python-threat-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['python-service:8000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
